# SADECE "kaynak kodu deposu" yöntemi içindir (Yöntem B, README_TR.md).
# Hazır paketi (READY_TO_UPLOAD) doğrudan yüklüyorsanız bu dosyayı KULLANMAYIN;
# o yöntemde Pages kaynağı "Deploy from a branch" olmalıdır.
#
# Bu iş akışı: içerik kontrolü + birim testleri + build, sonra dist/ klasörünü GitHub Pages'e yayımlar.
# Ayarlar → Pages → Source: "GitHub Actions" seçilmelidir.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
